name: gamoaibot
version: 0.1.0
description: "Hermes agent behind the GamoAI Red-DiscordBot cog; no native memory provider."
author: "Joaquín Gamonal"
license: "MIT"
hermes_requires: ">=0.23.0"

# The installer turns these into the profile's .env.EXAMPLE. Secrets stay local.
env_requires:
  - name: API_SERVER_KEY
    description: "Strong random key for the loopback OpenAI-compatible API server"
    required: true
  - name: API_SERVER_PORT
    description: "Loopback port for the gamoaibot API server"
    required: false
    default: "8643"
  - name: API_SERVER_HOST
    description: "API server bind address; keep it on loopback"
    required: false
    default: "127.0.0.1"
  - name: API_SERVER_ENABLED
    description: "Enable the API server"
    required: false
    default: "true"
  - name: HINDSIGHT_API_URL
    description: "Hindsight REST base URL (used by the cog, not by Hermes)"
    required: false
    default: "http://<INTERNAL_HOST>:8888"
  - name: HINDSIGHT_API_KEY
    description: "Hindsight API key (used by the cog)"
    required: false
    default: ""
  - name: HINDSIGHT_TIMEOUT
    description: "Hindsight REST timeout in seconds"
    required: false
    default: "30"
  - name: LLM_ENDPOINT
    description: "OpenAI-compatible endpoint the cog calls (Hermes API server)"
    required: false
    default: ""
  - name: LLM_API_KEY
    description: "Bearer key for LLM_ENDPOINT"
    required: false
    default: ""
  - name: LLM_MODEL
    description: "Model/profile name advertised to the cog"
    required: false
    default: "gamoaibot"
  - name: VISION_ENDPOINT
    description: "Optional separate multimodal endpoint; falls back to LLM_ENDPOINT"
    required: false
    default: ""
  - name: VISION_API_KEY
    description: "Optional separate multimodal key; falls back to LLM_API_KEY"
    required: false
    default: ""
  - name: VISION_MODEL
    description: "Optional separate multimodal model; falls back to LLM_MODEL"
    required: false
    default: ""
