name: gamoaibot
version: 0.1.0
description: "Hermes agent behind the GamoAI Red-DiscordBot cog; no native memory provider."
author: "Joaquín Gamonal"
license: "MIT"
hermes_requires: ">=0.23.0"

# The installer turns these into the profile's .env.EXAMPLE. Secrets stay local.
env_requires:
  - name: API_SERVER_KEY
    description: "Strong random key for the loopback OpenAI-compatible API server"
    required: true
  - name: API_SERVER_PORT
    description: "Loopback port for the gamoaibot API server"
    required: false
    default: "8643"
  - name: API_SERVER_HOST
    description: "API server bind address; keep it on loopback"
    required: false
    default: "127.0.0.1"
  - name: API_SERVER_ENABLED
    description: "Enable the API server"
    required: false
    default: "true"
