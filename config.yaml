# Non-secret defaults for the gamoaibot profile. Secrets live in the profile .env.
model:
  default: auto/thrifty
  provider: custom
  base_url: http://<PROVIDER_HOST>:20128

# The cog, not Hermes, owns Hindsight banks: no native provider, no auto retain/recall.
agent:
  max_turns: 10

memory:
  memory_enabled: false
  user_profile_enabled: false
  provider: ""
  # auto_retain/auto_recall are Hindsight plugin settings, not config.yaml keys.
  # This profile ships without the Hindsight plugin: no native bank writes.

terminal:
  # Explicit cwd: the API server exposes tools, so never leave this unbounded.
  cwd: <LOCAL_HOME>/GamoAICog/runtime

display:
  show_reasoning: false
