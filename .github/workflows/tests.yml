name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.9"
          python-version: "3.12"
      - name: Create venv and install dev dependencies
        run: |
          uv venv .venv --python 3.12 --clear
          uv pip install --python .venv/bin/python -r requirements-dev.txt
      - name: Run offline unit tests
        run: .venv/bin/python -m pytest -q tests --ignore=tests/integration
